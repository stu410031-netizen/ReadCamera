<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>QR Code 掃描系統</title>

    <!-- QR Code 掃描程式庫 -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        #reader {
            width: 350px;
            max-width: 95%;
            margin: auto;
            background: white;
            padding: 10px;
            border-radius: 10px;
        }

        #result {
            margin: 20px auto;
            padding: 15px;
            width: 90%;
            max-width: 500px;
            background: white;
            border-radius: 10px;
            font-size: 20px;
            word-break: break-all;
        }

        #status {
            margin-top: 15px;
            font-size: 18px;
        }

    </style>

</head>

<body>

    <h1>QR Code 掃描系統</h1>

    <div id="reader"></div>

    <div id="result">
        尚未掃描 QR Code
    </div>

    <div id="status">
        等待掃描...
    </div>


    <script>

        // ====================================
        // Google Apps Script Web App 網址
        // ====================================

        const GAS_URL =
            "https://script.google.com/a/macros/kssh.khc.edu.tw/s/AKfycbwoOX8l2mC9XaOtpxpcvbf3r23t15gjCh8Y9LRGHmfSOWMJmy2mh2jVtmrw4a8zLoiWeQ/exec";


        // 防止同一個 QR Code 連續寫入
        let lastCode = "";


        // ====================================
        // 掃描成功
        // ====================================

        function onScanSuccess(decodedText, decodedResult) {

            // 如果跟上一筆完全一樣，就不重複寫入
            if (decodedText === lastCode) {
                return;
            }

            lastCode = decodedText;


            // 顯示 QR Code 內容
            document.getElementById("result").innerText =
                "QR Code內容：\n" + decodedText;


            document.getElementById("status").innerText =
                "正在寫入 Google 試算表...";


            // 傳送到 Apps Script
            const url =
                GAS_URL +
                "?qr=" +
                encodeURIComponent(decodedText) +
                "&t=" +
                Date.now();


            // 使用圖片載入方式送出 GET
            const img = new Image();

            img.onload = function () {

                document.getElementById("status").innerText =
                    "✅ 已送出，請確認試算表";

            };


            img.onerror = function () {

                document.getElementById("status").innerText =
                    "⚠️ 已嘗試寫入，請確認試算表";

            };


            img.src = url;


            // 3 秒後允許再次掃描
            setTimeout(function () {

                lastCode = "";

                document.getElementById("status").innerText =
                    "可以掃描下一個 QR Code";

            }, 3000);

        }


        // ====================================
        // 掃描錯誤
        // ====================================

        function onScanFailure(error) {

            // 不需要一直顯示掃描錯誤
            // 因為沒有掃到 QR Code 是正常情況

        }


        // ====================================
        // 啟動攝影機
        // ====================================

        const html5QrCode =
            new Html5QrcodeScanner(
                "reader",
                {
                    fps: 10,
                    qrbox: {
                        width: 250,
                        height: 250
                    }
                },
                false
            );


        html5QrCode.render(
            onScanSuccess,
            onScanFailure
        );

    </script>

</body>

</html>
